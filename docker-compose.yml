services:
  db:
    image: postgres:16-alpine
    container_name: scopeproof_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scopeproof
      POSTGRES_PASSWORD: scopeproof_dev_password
      POSTGRES_DB: scopeproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeproof -d scopeproof"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

